server {
    listen 80;
    listen [::]:80;
    server_name 433lab.x.saharev.us;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 433lab.x.saharev.us;

    ssl_certificate /etc/letsencrypt/live/433lab.x.saharev.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/433lab.x.saharev.us/privkey.pem;

    location / {
        proxy_pass http://192.168.0.163:6060;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
