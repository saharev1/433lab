services:
  web:
    build: .
    container_name: 433lab-web
    ports:
      - "6060:6060"
    depends_on:
      - backend
    volumes:
      - media:/media
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: 433lab-backend
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@433lab.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin433}
      - MEDIA_DIR=/media
      - DB_PATH=/data/app.db
    volumes:
      - media:/media
      - dbdata:/data
    restart: unless-stopped

# Подсеть закреплена явно. По умолчанию Docker выдавал этой сети 172.18.0.0/16,
# что пересекается с VPN-интерфейсом singbox_tun (172.18.0.1/30) на хосте:
# адреса 172.18.0.2 и .3, которые получают контейнеры, перехватывались
# таблицей маршрутизации 2022 и таблицей local (.3 = broadcast для /30),
# из-за чего трафик до контейнеров не доходил (502/таймаут снаружи).
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  media:
  dbdata:
